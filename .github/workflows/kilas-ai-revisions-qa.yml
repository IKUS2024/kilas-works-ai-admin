name: Kilas AI Revisions QA
on:
  push:
    branches: [main]
    paths: ['client-hub/kilas_ai/**', 'client-hub/static/kilas_*', 'client-hub/templates/kilas_ai/**', 'client-hub/templates/kilas_translator/**', 'client-hub/templates/_premium_workspace.html', 'client-hub/templates/_account_workspace.html', 'client-hub/tests/test_kilas_ai_revisions*', 'client-hub/tests/test_kilas_dictation.mjs', '.github/workflows/kilas-ai-revisions-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nonpaid:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pip install -r client-hub/requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - name: Existing behavior and finite provider admission, synthetic transport only
        run: |
          cd client-hub
          python tests/test_kilas_ai_revisions.py
          python tests/test_kilas_audio.py
          python tests/test_kilas_audio_video_script.py
          python tests/test_kilas_personal_voice.py
          python tests/test_kilas_ai_unified.py
          python tests/test_kilas_home.py
          python tests/test_kilas_chat_auto_search.py
          node --test tests/test_kilas_dictation.mjs tests/test_transcription_recorder.mjs
      - name: Phone, tablet and desktop browser checks with synthetic microphone
        run: PYTHONPATH=client-hub:client-hub/tests python client-hub/tests/test_kilas_ai_revisions_browser.py
