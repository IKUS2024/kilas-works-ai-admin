name: Kilas Live Translator QA
on:
  push:
    branches: [main]
    paths: ['client-hub/kilas_ai/live_translator*.py', 'client-hub/kilas_ai/audio_routes.py', 'client-hub/kilas_ai/audio_schema.py', 'client-hub/kilas_ai/home_tasks.py', 'client-hub/static/kilas_live_translator*', 'client-hub/templates/kilas_translator/live.html', 'client-hub/templates/kilas_ai/_home_task_selector.html', 'client-hub/migrations/0092_*', 'client-hub/tests/test_kilas_live_translator*', 'client-hub/tests/test_kilas_ai_unified_browser.py', 'client-hub/tests/test_kilas_audio_postgres.py', 'client-hub/app.py', 'client-hub/db.py', '.github/workflows/kilas-live-translator-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pip install -r client-hub/requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: python client-hub/tests/test_kilas_live_translator.py
      - run: |
          for suite in test_kilas_live_translator_transport.py test_kilas_live_translator_sse.py test_kilas_live_translator_whole.py test_kilas_live_translator_realtime.py test_kilas_live_translator_incremental.py test_kilas_live_translator_flow.py; do
            python -B scripts/run_offline_tests.py --only "$suite" || exit 1
          done
      - run: node --test client-hub/tests/test_kilas_live_translator*.mjs
      - run: python client-hub/tests/test_kilas_live_translator_browser.py
      - run: python -B client-hub/tests/test_kilas_live_translator_app_browser.py
      - run: python client-hub/tests/test_kilas_ai_unified_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kilas-live-translator-synthetic
          path: |
            /tmp/kilas-live-translator-browser/
            /tmp/kilas-live-translator-app-browser/
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: live_translator_qa}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d live_translator_qa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r client-hub/requirements.txt
      - run: python client-hub/tests/test_kilas_audio_postgres.py
        env: {DATABASE_URL: 'postgresql://postgres:postgres@127.0.0.1:5432/live_translator_qa', KILAS_AI_POSTGRES_QA: '1'}
