name: Kilas Chat recovery QA
on:
  push:
    branches: [main, 'feature/ai-chat-recovery-*', 'feature/ai-chat-zoom-*']
  pull_request:
    paths: ['client-hub/kilas_ai/**', 'client-hub/static/kilas_chat_operation.js', 'client-hub/static/kilas_home.*', 'client-hub/static/kilas_chat.css', 'client-hub/templates/kilas_ai/**', 'client-hub/tests/test_kilas_chat_zoom_browser.py', 'client-hub/static/kilas_ai*.js', 'client-hub/migrations/0111*', 'client-hub/tests/test_kilas_chat_recovery*', '.github/workflows/kilas-chat-recovery-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pip install -r client-hub/requirements.txt
      - run: python -B scripts/run_offline_tests.py --only test_kilas_chat_recovery.py
      - run: node client-hub/tests/test_kilas_chat_operation.cjs
      - run: node --test client-hub/tests/test_kilas_ai_call.mjs
      - run: |
          python -B scripts/run_offline_tests.py --only test_kilas_chat_models.py
          python -B scripts/run_offline_tests.py --only test_kilas_chat_quality_v2.py
          python -B scripts/run_offline_tests.py --only test_kilas_sent_attachments.py
          python -B scripts/run_offline_tests.py --only test_kilas_workspace_runtime.py
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r client-hub/requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -B client-hub/tests/test_kilas_chat_recovery_browser.py
      - run: python -B client-hub/tests/test_kilas_chat_zoom_browser.py
      - run: python -B client-hub/tests/kilas_chat_keyboard_browser.py
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: recovery_qa}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r client-hub/requirements.txt
      - name: Disposable native PostgreSQL migration and concurrency
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/recovery_qa
          KILAS_CHAT_RECOVERY_POSTGRES_QA: '1'
        run: python -B client-hub/tests/test_kilas_chat_recovery_postgres.py
