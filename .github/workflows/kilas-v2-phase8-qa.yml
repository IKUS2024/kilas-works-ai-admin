name: Kilas V2 Phase 8 QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  whatsapp-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kilas_phase8
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d kilas_phase8"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r client-hub/requirements.txt
      - name: Signed webhook and shared Core SQLite
        run: python scripts/run_offline_tests.py --only test_kilas_whatsapp
      - name: PostgreSQL identities actions concurrency rollback and outbound
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kilas_phase8
          KILAS_PHASE8_POSTGRES_QA: '1'
        run: python client-hub/tests/kilas_whatsapp_postgres_qa.py
      - name: Install mobile QA browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start isolated harness
        env:
          PYTHONPATH: client-hub:client-hub/tests
          KILAS_PHASE8_BROWSER_QA: '1'
        run: |
          python client-hub/tests/kilas_whatsapp_dev.py >/tmp/phase8-browser-harness.log 2>&1 &
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8769/dev/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then cat /tmp/phase8-browser-harness.log; exit 1; fi
      - name: Mobile owner Inbox
        run: python client-hub/tests/kilas_whatsapp_browser_qa.py
      - name: Harness log
        if: always()
        run: cat /tmp/phase8-browser-harness.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kilas-phase8-mobile
          path: /tmp/kilas-phase8-browser-qa
          if-no-files-found: ignore
