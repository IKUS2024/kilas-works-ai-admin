name: Finance area nav verification
on:
  push:
    branches: [fix/finance-area-nav-20260919]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r client-hub/requirements.txt
      - name: Finance templates compile
        working-directory: client-hub
        run: |
          PYTHONPATH=.:tests python - <<'PY'
          import os
          os.environ.pop('DATABASE_URL', None)
          from app import app
          with app.app_context():
              for name in app.jinja_env.list_templates():
                  if 'finance' in name:
                      app.jinja_env.get_template(name)
          print('Finance templates compile: OK')
          PY
      - name: Finance focused UI regressions
        working-directory: client-hub
        run: |
          PYTHONPATH=.:tests python tests/test_finance_branches.py
          node --test tests/test_finance_branch_ui.cjs
