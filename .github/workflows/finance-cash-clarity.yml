name: Finance cash clarity verification
on:
  push:
    branches: [fix/finance-cash-clarity-20260919]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r client-hub/requirements.txt
      - name: Compile Finance modules
        run: python -m compileall -q client-hub/finance_fx.py client-hub/finance_service.py client-hub/routes_finance.py
      - name: Run FX precision tests
        working-directory: client-hub
        run: PYTHONPATH=. python tests/test_finance_fx_precision.py
      - name: Run Finance branch integration tests
        working-directory: client-hub
        run: PYTHONPATH=.:tests python tests/test_finance_branches.py
      - name: Compile Finance templates
        working-directory: client-hub
        run: |
          python - <<'PY'
          import os
          os.environ.pop('DATABASE_URL', None)
          from app import app
          with app.app_context():
              for name in app.jinja_env.list_templates():
                  if 'finance' in name:
                      app.jinja_env.get_template(name)
          print('Finance templates compile: OK')
          PY
      - name: Run balance display JS tests
        run: node --test client-hub/tests/test_finance_balance_display.cjs
