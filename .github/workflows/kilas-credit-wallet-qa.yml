name: Kilas inactive credit wallet QA
on:
  pull_request:
    paths: ['client-hub/**', '.github/workflows/kilas-credit-wallet-qa.yml']
  push:
    branches: [main]
    paths: ['client-hub/**', '.github/workflows/kilas-credit-wallet-qa.yml']
permissions:
  contents: read
env:
  PYTHONPATH: client-hub:client-hub/tests
  PYTHONDONTWRITEBYTECODE: '1'
  CLIENT_HUB_DB_PATH: /tmp/credit-wallet-bootstrap.sqlite
  DATABASE_URL: ''
  KILAS_CREDIT_ENFORCEMENT_ENABLED: 'no'
  KILAS_CREDIT_CUTOFF_CANDIDATE_ENABLED: 'no'
jobs:
  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pip install -r client-hub/requirements.txt 'pytest>=9,<10' 'pytest-socket>=0.7,<1'
      - name: Isolated synthetic wallet, consent, feature and rollback contracts
        run: |
          for suite in \
            wallet:WalletTests policy:PolicyTests adapters:AdapterTests \
            activation:ActivationTests cutoff_loader:CutoffTests \
            interpreter:InterpreterTests interpreter_routes:InterpreterRouteCreditTests \
            native:NativeCreditTests receipt_transport:ReceiptTransportTests \
            receipts:ReceiptCreditTests routes:CreditRoutesTests \
            work:WorkCreditTests work_routes:WorkRouteCreditTests \
            work_step_store:WorkStoreTests work_steps:WorkStepsTests; do
            file="${suite%%:*}"
            case="${suite#*:}"
            python -m pytest -q "client-hub/tests/test_kilas_credit_${file}.py::${case}" \
              --disable-socket --allow-unix-socket \
              --junitxml="/tmp/credit-wallet-qa/sqlite/${file}.xml"
          done
      - name: Interpreter consent and playback lifecycle, synthetic transport
        run: node --test client-hub/tests/test_kilas_interpreter.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: credit-wallet-sqlite, path: /tmp/credit-wallet-qa/sqlite}
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: synthetic-ci-only, POSTGRES_DB: kilas_credit_qa}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d kilas_credit_qa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KILAS_CREDIT_TEST_POSTGRES: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/kilas_credit_qa
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r client-hub/requirements.txt 'pytest>=9,<10' 'pytest-socket>=0.7,<1'
      - name: Sequential isolated ledger, quota and dispatch races in PostgreSQL
        run: |
          for suite in \
            wallet:WalletTests policy:PolicyTests adapters:AdapterTests \
            activation:ActivationTests cutoff_loader:CutoffTests \
            interpreter:InterpreterTests receipts:ReceiptCreditTests \
            work:WorkCreditTests work_step_store:WorkStoreTests; do
            file="${suite%%:*}"
            case="${suite#*:}"
            python -m pytest -q "client-hub/tests/test_kilas_credit_${file}.py::${case}" \
              --disable-socket --allow-unix-socket \
              --junitxml="/tmp/credit-wallet-qa/postgres/${file}.xml"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: credit-wallet-postgres, path: /tmp/credit-wallet-qa/postgres}
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEBUG: pw:browser
      KILAS_CREDIT_BROWSER_BUNDLED: 'yes'
      KILAS_CREDIT_BROWSER_MAJOR: '151'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      # 1.64.1 / Chromium 156 aborts in Blink's window_performance CHECK even
      # on the retained localhost-only popup fixture (run 42190631465).
      # Keep the released 1.62 toolchain until both fixture and real flow pass.
      - run: pip install -r client-hub/requirements.txt 'playwright==1.62.0' 'pytest>=9,<10' 'pytest-socket>=0.7,<1'
      # The runner's existing Chromium already demonstrates the shared libraries.
      # Install the pinned managed browser; don't upgrade the OS with apt here.
      - run: python -m playwright install --no-shell chromium
      - name: Minimal localhost popup, no application or account
        env: {KILAS_CREDIT_BROWSER_CASE: popup_repro}
        run: |
          python -m pytest -q -s client-hub/tests/test_kilas_credit_browser.py \
            --disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,::1
      - name: Standalone synthetic popup control without pytest integration
        if: always()
        env: {KILAS_CREDIT_REPRO_LABEL: standalone}
        run: python client-hub/tests/credit_popup_repro.py
      - name: Four languages, mobile and desktop, synthetic providers and payments
        if: always()
        run: |
          failed=0
          for case in wallet work work_steps; do
            KILAS_CREDIT_BROWSER_CASE="$case" python -m pytest -q \
              client-hub/tests/test_kilas_credit_browser.py \
              --disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,::1 \
              --junitxml="/tmp/credit-wallet-qa/browser/${case}.xml" || failed=1
          done
          test "$failed" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: credit-wallet-browser
          path: |
            /tmp/credit-wallet-qa/browser
            /tmp/kilas-credit-active-browser
            /tmp/kilas-credit-work-browser
            /tmp/kilas-credit-work-steps-browser
            /tmp/credit-wallet-popup-repro
