name: Kilas V2 Phase 6 QA

on:
  pull_request:
    branches:
      - main
    paths:
      - "client-hub/kilas_core/**"
      - "client-hub/public_chat/**"
      - "client-hub/migrations/0056_kilas_core_customers_*"
      - "client-hub/migrations/0057_kilas_core_jobs_*"
      - "client-hub/templates/*job*"
      - "client-hub/tests/*jobs*"
      - "client-hub/templates/customers.html"
      - "client-hub/templates/customer_detail.html"
      - "client-hub/templates/web_inbox.html"
      - "client-hub/templates/product_dashboard.html"
      - "client-hub/tests/test_kilas_customers*"
      - "client-hub/tests/public_chat_*"
      - "client-hub/tests/*playbook*"
      - "test_kilas_playbooks.py"
      - "client-hub/migrations/0058_kilas_operations_*"
      - "client-hub/tests/*operations*"
      - "client-hub/templates/*attention*"
      - "client-hub/templates/automations.html"
      - "client-hub/templates/assist_entry.html"
      - "client-hub/app.py"
      - "test_kilas_operations_contract.py"
      - "docs/KILAS_V2_PHASE6_STATUS.md"
      - ".github/workflows/kilas-v2-phase6-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase6-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kilas_phase4
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kilas_phase4"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r client-hub/requirements.txt
          pip install playwright

      - name: Phase 1 regression
        env:
          PYTHONPATH: client-hub
        run: python scripts/run_offline_tests.py --only test_kilas_core

      - name: Phase 2 focused regression
        env:
          PYTHONPATH: client-hub
        run: |
          python scripts/run_offline_tests.py --only test_public_chat_routes.py
          python scripts/run_offline_tests.py --only test_public_chat_store.py

      - name: Phase 3 Customers SQLite regression
        env:
          PYTHONPATH: client-hub
        run: python scripts/run_offline_tests.py --only test_kilas_customers.py

      - name: Phase 4 SQLite schema, service, security and concurrency
        env:
          PYTHONPATH: client-hub
        run: |
          python scripts/run_offline_tests.py --only test_kilas_jobs_schema.py
          python scripts/run_offline_tests.py --only test_kilas_jobs_store.py
          python scripts/run_offline_tests.py --only test_kilas_jobs_routes.py

      - name: Phase 5 SQLite understanding actions and WEB security
        env:
          PYTHONPATH: client-hub
        run: |
          python scripts/run_offline_tests.py --only test_kilas_playbooks.py
          python scripts/run_offline_tests.py --only test_kilas_playbook_actions.py
          python scripts/run_offline_tests.py --only test_kilas_playbook_routes.py

      - name: Phase 6 SQLite security idempotency concurrency and handover
        env:
          PYTHONPATH: client-hub
        run: |
          python scripts/run_offline_tests.py --only test_kilas_operations_contract.py
          python scripts/run_offline_tests.py --only test_kilas_operations_store.py
          python scripts/run_offline_tests.py --only test_kilas_operations_routes.py

      - name: Phase 2 PostgreSQL 0055 regression
        env:
          PYTHONPATH: client-hub
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kilas_phase4
          KILAS_PHASE2_POSTGRES_QA: "1"
          CLIENT_HUB_ENV: development
          RUN_MIGRATIONS_ON_BOOT: "false"
          SECRET_KEY: phase4-postgres-qa-only
        run: python client-hub/tests/test_public_chat_postgres.py

      - name: Phase 3 PostgreSQL 0056 validation
        env:
          PYTHONPATH: client-hub
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kilas_phase4
          KILAS_PHASE3_POSTGRES_QA: "1"
          CLIENT_HUB_ENV: development
          RUN_MIGRATIONS_ON_BOOT: "false"
          SECRET_KEY: phase4-postgres-qa-only
        run: python client-hub/tests/test_kilas_customers_postgres.py

      - name: Phase 4 PostgreSQL 0057 runtime and concurrency
        env:
          PYTHONPATH: client-hub
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kilas_phase4
          KILAS_PHASE4_POSTGRES_QA: "1"
          CLIENT_HUB_ENV: development
          RUN_MIGRATIONS_ON_BOOT: "false"
          SECRET_KEY: phase4-postgres-qa-only
        run: python client-hub/tests/test_kilas_jobs_postgres.py

      - name: Phase 5 PostgreSQL actions and concurrency
        env:
          PYTHONPATH: client-hub
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kilas_phase4
          KILAS_PHASE5_POSTGRES_QA: "1"
          CLIENT_HUB_ENV: development
          RUN_MIGRATIONS_ON_BOOT: "false"
          SECRET_KEY: phase5-postgres-qa-only
        run: python client-hub/tests/test_kilas_playbooks_postgres.py

      - name: Phase 6 PostgreSQL 0058 and atomic automations
        env:
          PYTHONPATH: client-hub
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kilas_phase4
          KILAS_PHASE6_POSTGRES_QA: "1"
          CLIENT_HUB_ENV: development
          RUN_MIGRATIONS_ON_BOOT: "false"
          SECRET_KEY: phase6-postgres-qa-only
        run: python client-hub/tests/test_kilas_operations_postgres.py

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Start disposable QA harness
        env:
          PYTHONPATH: client-hub:client-hub/tests
          KILAS_JOBS_QA: "true"
        run: |
          python client-hub/tests/public_chat_dev.py >/tmp/kilas-phase4-harness.log 2>&1 &
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8765/dev/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then cat /tmp/kilas-phase4-harness.log; exit 1; fi

      - name: Mobile browser QA including Customers
        env:
          KILAS_PUBLIC_CHAT_QA_BASE: http://127.0.0.1:8765
          KILAS_PUBLIC_CHAT_QA_OUT: /tmp/kilas-phase4-browser-qa
        run: python client-hub/tests/public_chat_browser_qa.py

      - name: Mobile Jobs and protected Finance QA
        env:
          KILAS_PUBLIC_CHAT_QA_BASE: http://127.0.0.1:8765
          KILAS_PUBLIC_CHAT_QA_OUT: /tmp/kilas-phase4-browser-qa
        run: python client-hub/tests/kilas_jobs_browser_qa.py

      - name: Start separate Phase 5 synthetic harness
        env:
          PYTHONPATH: client-hub:client-hub/tests
          KILAS_JOBS_QA: "true"
          KILAS_PLAYBOOKS_QA: "true"
          PORT: "8766"
        run: |
          python client-hub/tests/public_chat_dev.py >/tmp/kilas-phase5-harness.log 2>&1 &
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8766/dev/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then cat /tmp/kilas-phase5-harness.log; exit 1; fi

      - name: Phase 5 mobile logistics booking takeover and tenant QA
        env:
          KILAS_PUBLIC_CHAT_QA_BASE: http://127.0.0.1:8766
          KILAS_PUBLIC_CHAT_QA_OUT: /tmp/kilas-phase5-browser-qa
        run: python client-hub/tests/kilas_playbooks_browser_qa.py

      - name: Show Phase 5 harness log
        if: always()
        run: cat /tmp/kilas-phase5-harness.log || true

      - name: Upload Phase 5 browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kilas-phase5-browser-qa
          path: /tmp/kilas-phase5-browser-qa
          if-no-files-found: ignore

      - name: Show harness log
        if: always()
        run: cat /tmp/kilas-phase4-harness.log || true

      - name: Upload Phase 4 browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kilas-phase4-browser-qa
          path: /tmp/kilas-phase4-browser-qa
          if-no-files-found: ignore

      - name: Start separate Phase 6 synthetic harness
        env:
          PYTHONPATH: client-hub:client-hub/tests
          KILAS_JOBS_QA: "true"
          KILAS_PLAYBOOKS_QA: "true"
          KILAS_OPERATIONS_QA: "true"
          PORT: "8767"
        run: |
          python client-hub/tests/public_chat_dev.py >/tmp/kilas-phase6-harness.log 2>&1 &
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8767/dev/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then cat /tmp/kilas-phase6-harness.log; exit 1; fi

      - name: Phase 6 mobile human Attention followup review and tenant QA
        env:
          KILAS_PUBLIC_CHAT_QA_BASE: http://127.0.0.1:8767
          KILAS_PUBLIC_CHAT_QA_OUT: /tmp/kilas-phase6-browser-qa
        run: python client-hub/tests/kilas_operations_browser_qa.py

      - name: Show Phase 6 harness log
        if: always()
        run: cat /tmp/kilas-phase6-harness.log || true

      - name: Upload Phase 6 browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kilas-phase6-browser-qa
          path: /tmp/kilas-phase6-browser-qa
          if-no-files-found: ignore
