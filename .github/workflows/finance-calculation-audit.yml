name: Finance calculation regressions
on:
  pull_request:
    branches: [main]
    paths:
      - 'client-hub/finance_*.py'
      - 'client-hub/routes_finance.py'
      - 'client-hub/tests/*finance*'
      - '.github/workflows/finance-calculation-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calculations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-finance-audit
          POSTGRES_DB: kilas_finance_qa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d kilas_finance_qa"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r client-hub/requirements.txt
      - name: Isolated offline calculations, account edits, invoices, transfers, plans and receipt review
        run: >-
          python client-hub/tests/run_finance_regressions.py
          test_finance_calculation_audit test_finance_approved_revisions
          test_finance_edit_package test_finance_expense_entries test_finance_purchase_plans
          test_finance_fx_precision test_finance_invoice_editor test_finance_direction_filters
          test_finance_ui_integrity test_finance_workspace_corrections
          test_finance_final_package test_finance_receipt_preview test_kilas_finance_baseline
          test_kilas_finance_bridge test_kilas_finance_bridge_routes
          test_finance_money_input_audit test_finance_installment_currency_audit
          test_finance_reversal_account_audit test_finance_empty_workspace_audit
          test_finance_branches test_finance_branch_delete_recovery test_finance_bank_manual_audit
          test_finance_phase2a test_finance_phase2b test_finance_phase3
          test_finance_phase5ab test_finance_phase5c test_finance_personal_reset
      - name: Native PostgreSQL arithmetic, scopes and atomic payment edits
        env:
          DATABASE_URL: postgresql://postgres:synthetic-finance-audit@127.0.0.1:5432/kilas_finance_qa
          FINANCE_LOCAL_PG_QA: '1'
          CLIENT_HUB_ENV: test
          SECRET_KEY: synthetic-finance-audit-only
        run: |
          python client-hub/tests/finance_calculation_postgres_qa.py
          python client-hub/tests/finance_edit_postgres_qa.py
          python client-hub/tests/finance_invariant_postgres_qa.py
