name: Kilas Autonomous Agent QA
on:
  push:
    branches: [main, feature/kilas-ai-product-hardening-v1-20261003, feature/kilas-ai-unified-20261002, feature/kilas-work-real-worker-v2-20261002, feature/kilas-autonomous-agent-v1-20261002, feature/kilas-agent-chat-experience-20261002, fix/kilas-unified-chat-agent-shell-20261002, fix/kilas-agent-response-result-polish-20261002, fix/kilas-ai-cost-quality-routing-20261002, feature/kilas-work-universal-output-20261002]
  pull_request:
    branches: [main]
    paths:
      - 'client-hub/kilas_ai/**'
      - 'client-hub/migrations/0078_*'
      - 'client-hub/migrations/0079_*'
      - 'client-hub/migrations/0080_*'
      - 'client-hub/migrations/0081_*'
      - 'client-hub/tests/test_kilas_work*'
      - 'client-hub/tests/test_kilas_chat_intents.py'
      - 'client-hub/tests/test_kilas_composer_focus_browser.py'
      - 'client-hub/tests/fixtures/kilas_document_standard.json'
      - 'client-hub/tests/test_kilas_agent_chat*'
      - 'client-hub/tests/test_kilas_agent_results*'
      - 'client-hub/tests/test_kilas_ai_cost_quality.py'
      - 'client-hub/tests/fixtures/kilas_conversation_standard.json'
      - 'client-hub/scripts/kilas_ai_cost_simulation.py'
      - 'client-hub/tests/test_kilas_autonomous*'
      - 'client-hub/templates/kilas_ai/**'
      - 'client-hub/static/kilas_ai_agent.css'
      - 'client-hub/static/kilas_ai_agent_chat.js'
      - 'client-hub/static/kilas_work*.js'
      - 'client-hub/static/kilas_ai_shell.js'
      - 'client-hub/static/kilas_ai.css'
      - 'client-hub/static/kilas_ai.js'
      - 'client-hub/static/kilas_ai_markdown.js'
      - 'client-hub/tests/test_kilas_ai_shell_browser.py'
      - '.github/workflows/kilas-autonomous-agent-qa.yml'
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r client-hub/requirements.txt
      - run: python client-hub/tests/test_kilas_autonomous_agent.py
      - run: python client-hub/tests/test_kilas_agent_chat_experience.py
      - run: python client-hub/tests/test_kilas_agent_results.py
      - run: python client-hub/tests/test_kilas_ai_cost_quality.py
      - run: python client-hub/tests/test_kilas_intelligence_capacity.py
      - run: python client-hub/tests/test_kilas_work_documents.py
      - run: python client-hub/tests/test_kilas_ai_unified.py
      - run: python client-hub/tests/test_kilas_product_hardening.py
      - run: python client-hub/tests/test_kilas_image_followup.py
      - run: python client-hub/tests/test_kilas_ai_chat_cleanup.py
      - run: python client-hub/tests/test_kilas_chat_quality_v2.py
      - run: python client-hub/tests/test_kilas_work_v2.py
      - run: python client-hub/tests/test_kilas_chat_intents.py
      - run: python client-hub/tests/test_kilas_ai_usage.py
      - run: python client-hub/tests/test_kilas_ai_attachments.py
      - run: python client-hub/tests/test_kilas_ai_pdf.py
      - run: python client-hub/tests/test_kilas_ai_natural_style.py
      - run: python client-hub/tests/test_kilas_ai_topups.py
      - run: python client-hub/tests/test_kilas_ai_single_plan_console.py
      - run: python client-hub/tests/test_kilas_ai_agent.py
      - run: python client-hub/tests/test_kilas_ai_automation.py
      - run: python client-hub/tests/test_kilas_ai_connectors.py
      - run: python client-hub/tests/test_kilas_ai_tools.py
      - run: python client-hub/tests/test_kilas_ai_chat.py
      - run: python client-hub/tests/test_kilas_finance_baseline.py
      - run: python client-hub/tests/test_assist_connections.py
  code-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r client-hub/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Allow namespaces only on disposable CI host
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: python client-hub/tests/test_kilas_autonomous_code_sandbox.py
        env:
          REQUIRE_SANDBOX_QA: '1'
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r client-hub/requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: python client-hub/tests/test_kilas_autonomous_browser.py
      - run: python client-hub/tests/test_kilas_agent_chat_browser.py
      - run: python client-hub/tests/test_kilas_agent_results_browser.py
      - run: python client-hub/tests/test_kilas_ai_agent_browser.py
      - run: python client-hub/tests/test_kilas_ai_shell_browser.py
      - run: python client-hub/tests/test_kilas_ai_browser.py
      - run: python client-hub/tests/test_kilas_capacity_browser.py
      - run: python client-hub/tests/test_kilas_work_browser.py
      - run: python client-hub/tests/test_kilas_work_v2_browser.py
      - run: python client-hub/tests/test_kilas_ai_unified_browser.py
      - run: python client-hub/tests/test_kilas_composer_focus_browser.py
      - run: python client-hub/tests/test_kilas_premium_ui_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kilas-agent-chat-responsive
          path: |
            /tmp/kilas-premium-ui-qa/*.png
            /tmp/agent-*.png
            /tmp/kilas-shell-*.png
            /tmp/kilas-work-v2-*.png
            /tmp/kilas-unified-*.png
          if-no-files-found: ignore
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autonomous_qa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d autonomous_qa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r client-hub/requirements.txt
      - run: python client-hub/tests/test_kilas_autonomous_postgres.py
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/autonomous_qa
          KILAS_AI_POSTGRES_QA: '1'
          SECRET_KEY: synthetic-autonomous-pg-qa
      - run: python client-hub/tests/test_kilas_agent_chat_postgres.py
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/autonomous_qa
          KILAS_AI_POSTGRES_QA: '1'
          SECRET_KEY: synthetic-chat-pg-qa

      - run: python client-hub/tests/test_kilas_capacity_postgres.py
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/autonomous_qa
          KILAS_AI_POSTGRES_QA: '1'
          SECRET_KEY: synthetic-capacity-pg-qa
