name: Kilas Learning QA
on:
  push:
    branches: [main]
    paths: ['client-hub/kilas_ai/learning*.py', 'client-hub/static/kilas_learning*', 'client-hub/templates/kilas_learning/**', 'client-hub/migrations/0093_kilas_learning*', 'client-hub/tests/test_kilas_learning*', 'client-hub/app.py', 'client-hub/requirements.txt', 'client-hub/templates/kilas_ai/_home_task_selector.html', '.github/workflows/kilas-learning-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pip install -r client-hub/requirements.txt ruff
      - run: python -m compileall -q client-hub/kilas_ai/learning.py client-hub/kilas_ai/learning_realtime.py client-hub/kilas_ai/learning_store.py client-hub/kilas_ai/learning_routes.py client-hub/kilas_ai/learning_schema.py client-hub/kilas_ai/learning_phrases.py
      - run: ruff check --select E9,F client-hub/kilas_ai/learning*.py client-hub/tests/test_kilas_learning.py
      - run: python -m unittest test_kilas_learning test_kilas_home test_kilas_ai_unified -q
        working-directory: client-hub
        env: {PYTHONPATH: '.:tests', PYTHONDONTWRITEBYTECODE: '1'}
      - run: node --test client-hub/tests/test_kilas_learning*.mjs
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: learning_qa}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d learning_qa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r client-hub/requirements.txt
      - run: python client-hub/tests/test_kilas_learning_postgres.py
        env: {DATABASE_URL: 'postgresql://postgres:postgres@127.0.0.1:5432/learning_qa', KILAS_AI_POSTGRES_QA: '1'}
