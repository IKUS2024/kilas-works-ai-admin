name: Kilas Learning QA
on:
  push:
    branches: [main]
    paths: ['client-hub/kilas_ai/learning*.py', 'client-hub/static/kilas_learning*', 'client-hub/templates/kilas_learning/**', 'client-hub/migrations/0093_kilas_learning*', 'client-hub/tests/test_kilas_learning*', 'client-hub/kilas_ai/free_test.py', 'client-hub/kilas_ai/usage.py', 'client-hub/kilas_ai/audio*.py', 'client-hub/kilas_ai/live_translator*.py', 'client-hub/kilas_ai/routes.py', 'client-hub/kilas_ai/connector_routes.py', 'client-hub/migrations/0095_kilas_free_test*', 'client-hub/tests/test_kilas_free_test.py', 'client-hub/app.py', 'client-hub/requirements.txt', 'client-hub/templates/kilas_ai/_home_task_selector.html', '.github/workflows/kilas-learning-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pip install -r client-hub/requirements.txt ruff
      - name: Install isolated browser-free DOM test utility
        run: npm install --prefix /tmp/kilas-learning-dom --cache /tmp/kilas-learning-npm-cache --no-audit --no-fund --save-exact jsdom@26.1.0
      - run: python -m compileall -q client-hub/kilas_ai/learning.py client-hub/kilas_ai/learning_realtime.py client-hub/kilas_ai/learning_store.py client-hub/kilas_ai/learning_routes.py client-hub/kilas_ai/learning_schema.py client-hub/kilas_ai/learning_phrases.py client-hub/kilas_ai/free_test.py
      - run: ruff check --select E9,F client-hub/kilas_ai/learning*.py client-hub/tests/test_kilas_learning.py client-hub/kilas_ai/free_test.py client-hub/tests/test_kilas_free_test.py
      - name: Isolated offline module suites
        run: |
          for suite in 'test_kilas_free_test' 'test_kilas_learning test_kilas_home test_kilas_ai_unified' 'test_kilas_audio' 'test_kilas_audio_video_script' 'test_kilas_live_translator' 'test_kilas_live_translator_realtime' 'test_kilas_live_translator_realtime_check' 'test_kilas_live_translator_segments' 'test_kilas_live_translator_whole' 'test_kilas_live_translator_transport' 'test_kilas_ai_cost_quality'; do
            python -m unittest $suite -q || exit 1
          done
        working-directory: client-hub
        env: {PYTHONPATH: '../scripts/offline_tests:.:tests', PYTHONDONTWRITEBYTECODE: '1', KILAS_LEARNING_DOM_FIXTURE_PATH: '/tmp/kilas-learning-dom/rendered-home.html'}
      - run: node --test client-hub/tests/test_kilas_learning*.mjs client-hub/tests/test_kilas_live_translator*.mjs
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: learning_qa}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d learning_qa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r client-hub/requirements.txt
      - run: python client-hub/tests/test_kilas_learning_postgres.py
        env: {DATABASE_URL: 'postgresql://postgres:postgres@127.0.0.1:5432/learning_qa', KILAS_AI_POSTGRES_QA: '1'}
