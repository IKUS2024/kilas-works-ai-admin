name: Kilas AI Focused QA
on:
  push:
    branches: [main, 'feature/kilas-ai-quota-work-master-*']
    paths:
      - 'client-hub/kilas_ai/**'
      - 'client-hub/migrations/0071_kilas_ai_v1_*.sql'
      - 'client-hub/migrations/0072_kilas_ai_usage_status_*.sql'
      - 'client-hub/migrations/0073_kilas_ai_topups_*.sql'
      - 'client-hub/tests/test_kilas_ai_*.py'
      - 'client-hub/app.py'
      - 'client-hub/db.py'
      - 'client-hub/routes_products.py'
      - 'client-hub/routes_workspace.py'
      - 'client-hub/templates/kilas_ai/**'
      - 'client-hub/static/kilas_ai.*'
      - 'client-hub/templates/product_start.html'
      - '.github/workflows/kilas-ai-focused-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r client-hub/requirements.txt
      - name: Account-owned Kilas AI foundation
        run: cd client-hub && python tests/test_kilas_ai_foundation.py
      - name: Kilas AI chat and provider fallback
        run: cd client-hub && python tests/test_kilas_ai_chat.py
      - name: Kilas AI durable attachments and image context
        run: cd client-hub && python tests/test_kilas_ai_attachments.py
      - name: Kilas AI real PDF generation and account isolation
        run: cd client-hub && python tests/test_kilas_ai_pdf.py
      - name: Kilas AI web citations, image tools and sharing
        run: cd client-hub && python tests/test_kilas_ai_tools.py
      - name: Kilas AI per-account quota and cost accounting
        run: cd client-hub && python tests/test_kilas_ai_usage.py
      - name: Kilas AI automatic routing and single-unit accounting
        run: cd client-hub && python tests/test_kilas_ai_routing.py
      - name: Kilas AI account billing and manual review
        run: cd client-hub && python tests/test_kilas_ai_billing.py
      - name: Kilas AI Kuota Kilas fair use and verified top-ups
        run: cd client-hub && python tests/test_kilas_ai_topups.py
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r client-hub/requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - name: Kilas AI Chromium desktop, tablet, mobile and checkout
        run: cd client-hub && python tests/test_kilas_ai_browser.py
  postgres-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kilas_ai_qa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d kilas_ai_qa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r client-hub/requirements.txt
      - name: Kilas AI additive PostgreSQL release in disposable schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kilas_ai_qa
          KILAS_AI_POSTGRES_QA: '1'
          SECRET_KEY: synthetic-kilas-ai-schema-only
        run: python client-hub/tests/test_kilas_ai_postgres_schema.py
