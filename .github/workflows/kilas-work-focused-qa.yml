name: Kilas Work focused QA
on:
  push:
    paths:
      - 'client-hub/kilas_work/**'
      - 'client-hub/migrations/0074_kilas_work_v1_*.sql'
      - 'client-hub/tests/test_kilas_work_*.py'
      - 'client-hub/templates/kilas_work/**'
      - 'client-hub/static/kilas_work.css'
      - '.github/workflows/kilas-work-focused-qa.yml'
  pull_request:
    paths:
      - 'client-hub/kilas_work/**'
      - 'client-hub/migrations/0074_kilas_work_v1_*.sql'
      - 'client-hub/tests/test_kilas_work_*.py'
      - 'client-hub/templates/kilas_work/**'
      - 'client-hub/static/kilas_work.css'
      - '.github/workflows/kilas-work-focused-qa.yml'
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r client-hub/requirements.txt
      - run: cd client-hub && python tests/test_kilas_work_foundation.py
      - run: cd client-hub && python tests/test_kilas_finance_baseline.py && python tests/test_assist_connections.py
