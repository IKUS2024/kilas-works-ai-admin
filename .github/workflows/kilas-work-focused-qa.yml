name: Kilas Work focused QA
on:
  push:
    paths:
      - 'client-hub/kilas_work/**'
      - 'client-hub/migrations/0074_kilas_work_v1_*.sql'
      - 'client-hub/tests/test_kilas_work_*.py'
      - 'client-hub/templates/kilas_work/**'
      - 'client-hub/static/kilas_work.css'
      - '.github/workflows/kilas-work-focused-qa.yml'
  pull_request:
    paths:
      - 'client-hub/kilas_work/**'
      - 'client-hub/migrations/0074_kilas_work_v1_*.sql'
      - 'client-hub/tests/test_kilas_work_*.py'
      - 'client-hub/templates/kilas_work/**'
      - 'client-hub/static/kilas_work.css'
      - '.github/workflows/kilas-work-focused-qa.yml'
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r client-hub/requirements.txt
      - run: cd client-hub && python tests/test_kilas_work_foundation.py
      - run: cd client-hub && python tests/test_kilas_work_browser_safety.py
      - run: cd client-hub && python tests/test_kilas_work_browser_worker.py
      - run: cd client-hub && python tests/test_kilas_work_browser_jobs.py
      - run: cd client-hub && python tests/test_kilas_finance_baseline.py && python tests/test_assist_connections.py
  postgres-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kilas_work_qa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d kilas_work_qa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r client-hub/requirements.txt
      - name: Work additive PostgreSQL release in disposable schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kilas_work_qa
          KILAS_WORK_POSTGRES_QA: '1'
          SECRET_KEY: synthetic-kilas-work-schema-only
        run: python client-hub/tests/test_kilas_work_postgres_schema.py
