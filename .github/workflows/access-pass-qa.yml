name: Access Pass 30 Day QA
on:
  pull_request:
    paths:
      - 'client-hub/kilas_ai/**'
      - 'client-hub/db.py'
      - 'client-hub/migrations/0115*'
      - 'client-hub/templates/kilas_ai/access_usage.html'
      - 'client-hub/templates/kilas_ai/invoice.html'
      - 'client-hub/static/kilas_access_usage.*'
      - 'client-hub/tests/test_access_pass*'
      - '.github/workflows/access-pass-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r client-hub/requirements.txt
      - run: python client-hub/tests/test_access_pass.py
      - run: python client-hub/tests/test_platform_manual_payments.py
      - run: |
          for suite in test_kilas_live_gemini_budget test_kilas_ai_call test_kilas_live_gemini_readiness test_kilas_live_gemini_pair_routes test_kilas_live_gemini test_kilas_live_gemini_pair test_kilas_audio test_kilas_live_translator_segments test_kilas_live_translator_clauses; do
            PYTHONPATH=client-hub:client-hub/tests python -m unittest "$suite" || exit 1
          done
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: access_pass_qa}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d access_pass_qa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r client-hub/requirements.txt
      - run: python client-hub/tests/test_access_pass_postgres.py
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/access_pass_qa
          KILAS_AI_POSTGRES_QA: '1'
      - run: python client-hub/tests/test_platform_manual_payments_postgres.py
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/access_pass_qa
          KILAS_AI_POSTGRES_QA: '1'
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r client-hub/requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: python client-hub/tests/test_access_pass_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: access-pass-responsive
          path: /tmp/access-pass-browser/
