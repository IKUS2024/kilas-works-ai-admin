name: Kilas V2 Phase 9 QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  product-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r client-hub/requirements.txt
      - name: Package navigation retirement and CSRF
        run: python scripts/run_offline_tests.py --only test_kilas_workspace.py
      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start isolated UI harness
        env:
          PYTHONPATH: client-hub:client-hub/tests
          KILAS_PHASE9_BROWSER_QA: '1'
        run: |
          python client-hub/tests/kilas_workspace_dev.py >/tmp/phase9-harness.log 2>&1 &
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8770/dev/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then cat /tmp/phase9-harness.log; exit 1; fi
      - name: Package and operator UI at mobile tablet desktop sizes
        run: python client-hub/tests/kilas_workspace_browser_qa.py
      - name: Harness diagnostics
        if: always()
        run: cat /tmp/phase9-harness.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kilas-phase9-responsive
          path: /tmp/kilas-phase9-browser-qa
          if-no-files-found: ignore
