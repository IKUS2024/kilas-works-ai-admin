{% extends "base.html" %}
{% block title %}Pilih Produk · Kilas Works{% endblock %}
{% block content %}
<style>
body.customer-ui{background:#0b0d10;color:#f5f6f8}
body.customer-ui>.topbar,body.customer-ui>.customer-global-shell,body.customer-ui>.customer-global-bottom,body.customer-ui>footer{display:none!important}
body.customer-ui>.wrap{max-width:none!important;margin:0!important;padding:0!important}
.product-start-shell{
  --ps-orange:#ff7a1a;--ps-border:#30363f;
  min-height:100svh;box-sizing:border-box;padding:20px 16px 24px;
  background:radial-gradient(520px 320px at 92% 3%,rgba(255,122,26,.09),transparent 70%),#0b0d10
}
.product-start-inner{width:min(100%,720px);margin:0 auto}
.product-start-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}
.product-start-brand{display:flex;align-items:center;gap:11px;min-width:0}
.product-start-logo{width:48px;height:48px;border-radius:14px;display:block;box-shadow:0 10px 28px rgba(255,122,26,.12)}
.product-start-wordmark strong{display:block;font-size:24px;line-height:1;letter-spacing:-.04em}
.product-start-wordmark strong span{color:var(--ps-orange)}
.product-start-wordmark small{display:block;margin-top:4px;color:#a7aeb8;font-size:12px}
.product-start-logout{
  min-height:36px;padding:7px 10px;border:1px solid #3b424c;border-radius:10px;display:inline-flex;align-items:center;gap:7px;
  background:#11151a;color:#d9dde2;text-decoration:none;font-size:11px;font-weight:850
}
.product-start-logout svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.product-start-head{margin:0 2px 20px}
.product-start-head h1{margin:0 0 7px;font-size:34px;line-height:1.02;letter-spacing:-.045em}
.product-start-head p{margin:0;color:#aeb4bd;font-size:14px;line-height:1.45}
.product-start-stack{display:grid;gap:11px}
.product-tile-form{margin:0}
.product-tile{
  width:100%;min-height:148px;padding:13px 14px;border:1px solid var(--ps-border);border-radius:20px;
  display:grid;grid-template-columns:142px minmax(0,1fr) 46px;align-items:center;gap:14px;
  background:
    radial-gradient(240px 170px at 88% 10%,rgba(255,122,26,.08),transparent 72%),
    linear-gradient(155deg,#181d23,#11151a);
  color:#f4f5f7;text-align:left;cursor:pointer;box-shadow:none;overflow:hidden
}
.product-tile.finance{border-color:rgba(255,122,26,.65)}
.product-tile:hover,.product-tile:focus-visible{border-color:rgba(255,122,26,.75);outline:none}
.product-tile-art{
  width:142px;height:118px;border-radius:16px;overflow:hidden;display:grid;place-items:center;
  background:#17191d
}
.product-tile-art img{width:100%;height:100%;display:block;object-fit:cover}
.product-tile-copy{min-width:0}
.product-tile-copy h2{margin:0 0 7px;font-size:22px;line-height:1.1;letter-spacing:-.035em}
.product-tile-copy p{margin:0;color:#a9b0b9;font-size:13px;line-height:1.4}
.product-tile-arrow{
  width:44px;height:44px;border-radius:50%;display:grid;place-items:center;justify-self:end;
  background:linear-gradient(180deg,#ff862f,#ff7415);color:#17110d;font-size:25px;font-weight:800;
  box-shadow:0 8px 20px rgba(255,122,26,.18)
}
@media(min-width:760px){
  .product-start-stack{grid-template-columns:repeat(2,minmax(0,1fr))}
  .product-tile{min-height:250px;grid-template-columns:1fr;grid-template-rows:128px auto 46px;gap:12px;text-align:center}
  .product-tile-art{width:100%;height:128px}
  .product-tile-arrow{justify-self:center}
}
@media(max-width:520px){
  .product-start-shell{padding:18px 14px 20px}
  .product-start-top{margin-bottom:21px}
  .product-start-logo{width:44px;height:44px}.product-start-wordmark strong{font-size:22px}.product-start-wordmark small{font-size:11.5px}
  .product-start-head{margin-bottom:16px}.product-start-head h1{font-size:30px}.product-start-head p{font-size:13px}
  .product-start-stack{gap:9px}
  .product-tile{min-height:132px;padding:10px 11px;grid-template-columns:118px minmax(0,1fr) 40px;gap:11px;border-radius:18px}
  .product-tile-art{width:118px;height:104px;border-radius:14px}
  .product-tile-copy h2{font-size:19px;margin-bottom:5px}
  .product-tile-copy p{font-size:11.5px;line-height:1.35}
  .product-tile-arrow{width:38px;height:38px;font-size:22px}
}
@media(max-width:390px){
  .product-tile{grid-template-columns:100px minmax(0,1fr) 36px}
  .product-tile-art{width:100px;height:92px}
  .product-tile-copy h2{font-size:17px}
  .product-tile-copy p{font-size:10.5px}
  .product-tile-arrow{width:34px;height:34px;font-size:20px}
}
</style>
