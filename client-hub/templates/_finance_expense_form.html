{% macro picker(prefix, label) %}
<div class="expense-picker" data-expense-picker>
<label>{{ ui_t(label) }}<select name="{{ prefix }}category_id" data-expense-parent required><option value="">{{ ui_t('Pilih kategori') }}</option>{% for c in categories if c.is_active and c.direction=='EXPENSE' and not c.parent_category_id %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></label>
<label data-expense-child-label hidden>{{ ui_t('Subkategori') }}<select name="{{ prefix }}subcategory_id" data-expense-child disabled><option value="">{{ ui_t('Pilih subkategori') }}</option>{% for c in categories if c.is_active and c.direction=='EXPENSE' and c.parent_category_id %}<option value="{{ c.id }}" data-parent="{{ c.parent_category_id }}">{{ c.name }}</option>{% endfor %}</select></label>
{% if prefix %}<input type="hidden" name="{{ prefix }}subcategory_id" value="" data-expense-empty-child>{% endif %}
</div>
{% endmacro %}
<form id="{{ 'edit-expense' if expense else 'add-expense' }}" method="post" enctype="multipart/form-data" action="{{ url_for('finance.edit_transaction',business_id=business.id,branch_id=g.finance_branch_id,transaction_id=expense.id) if expense else url_for('finance.create_transaction',business_id=business.id,branch_id=g.finance_branch_id) }}" class="expense-entry" data-expense-form data-initial-category="{{ expense.category_id if expense else '' }}" data-initial-splits='{{ (expense_splits or [])|tojson }}'>
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="direction" value="EXPENSE">
{% if expense %}<input type="hidden" name="expected_updated_at" value="{{ expense.updated_at }}">{% else %}<input type="hidden" name="submission_key" value="{{ expense_submission_key }}">{% endif %}
<div class="expense-top-grid">
<div class="expense-photo"><label class="expense-camera" tabindex="0">{{ ui_t('Foto struk') }}<svg aria-hidden="true" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 7h4l2-3h4l2 3h4v13H4z"/><circle cx="12" cy="13" r="4"/></svg><input type="file" name="receipt" accept="image/jpeg,image/png,image/webp" capture="environment" data-expense-photo></label><span data-expense-photo-name></span>{% if expense_receipt_exists %}<a href="{{ url_for('finance.expense_receipt',business_id=business.id,branch_id=g.finance_branch_id,transaction_id=expense.id) }}">{{ ui_t('Lihat struk') }}</a>{% endif %}</div>
<div class="expense-categories"><div data-expense-single>{{ picker('', 'Kategori / Subkategori') }}</div><label class="expense-split-toggle"><input type="checkbox" name="split_enabled" value="1" data-expense-split-toggle> {{ ui_t('Bagi kategori') }}</label></div>
</div>
<div data-expense-splits hidden></div>
<button type="button" class="finance-mini-action" data-expense-add-split hidden>{{ ui_t('Tambah bagian') }}</button>
<template data-expense-split-template><div class="expense-split-row">{{ picker('split_', 'Kategori / Subkategori') }}<label>{{ ui_t('Nominal') }}<input name="split_amount" inputmode="decimal" maxlength="25" required></label><button type="button" class="finance-mini-action" data-expense-remove-split>{{ ui_t('Hapus') }}</button></div></template>
<div class="expense-row"><label>{{ ui_t('Tanggal') }}<input name="occurred_on" type="date" value="{{ expense.occurred_on if expense else today }}" max="{{ today }}" required></label><label><span>{{ ui_t('Nominal') }} <span data-expense-currency></span></span><input name="amount" inputmode="decimal" maxlength="25" value="{{ expense.amount_minor|finance_input_money(expense.currency) if expense else '' }}" required></label></div>
<div class="expense-row"><label>{{ ui_t('Bayar dari') }}<select name="account_id" data-expense-account required><option value="">{{ ui_t('Pilih akun') }}</option>{% for a in entry_accounts if a.is_active and (not expense or a.currency==expense.currency) %}<option value="{{ a.id }}" data-currency="{{ a.currency }}" {{ 'selected' if (expense and a.id==expense.account_id) or (not expense and (a.id==transaction_account_id or (selected_account and a.id==selected_account.id))) }}>{{ a.name }} · {{ a.currency }}</option>{% endfor %}</select></label><label>{{ ui_t('Penerima (opsional)') }}<input name="counterparty_name" maxlength="160" value="{{ expense.counterparty_name or '' if expense else '' }}" list="expense-payees"><datalist id="expense-payees">{% for p in payees|default([]) if p.is_active %}<option value="{{ p.name }}">{% endfor %}</datalist></label></div>
<label>{{ ui_t('Catatan (opsional)') }}<textarea name="notes" maxlength="4000">{{ expense.notes or '' if expense else '' }}</textarea></label>
<input type="hidden" name="description" value="{{ expense.description or '' if expense else '' }}">
</form>
