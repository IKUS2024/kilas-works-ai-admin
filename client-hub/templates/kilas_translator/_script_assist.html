<details class="voice-script-assist" id="voice-script-assist">
<summary>{{ ui_t("Bantu AI") }}</summary>
<p class="voice-assist-usage">{{ ui_t("Bantu AI memakai kuota chat.") }}</p>
<label for="voice-assist-mode">{{ ui_t("Bantuan naskah") }}</label><select id="voice-assist-mode"><option value="tidy">{{ ui_t("Rapikan naskah") }}</option><option value="generate">{{ ui_t("Buat naskah dari ide") }}</option></select>
<div id="voice-assist-idea" hidden><label for="voice-assist-prompt">{{ ui_t("Ide atau arahan") }}</label><input type="text" id="voice-assist-prompt" maxlength="4000" placeholder="{{ ui_t('Contoh: promosi kopi lokal untuk video 30 detik') }}"></div>
<div class="voice-assist-actions"><button type="button" class="btn secondary" id="voice-assist-generate">{{ ui_t("Bantu naskah") }}</button><button type="button" class="btn secondary" id="voice-assist-stop" hidden>Stop AI</button></div>
<div class="voice-assist-actions"><button type="button" class="btn secondary" id="voice-assist-undo" hidden>{{ ui_t("Undo bantuan AI") }}</button><a id="voice-assist-history" href="#" hidden>{{ ui_t("Lihat percakapan") }}</a></div>
</details>
<p id="voice-assist-status" role="status" aria-live="polite"></p>
