<details class="voice-script-assist" id="voice-script-assist">
<summary>Bantu AI</summary>
<p class="voice-assist-usage">Bantu AI memakai kuota chat.</p>
<label for="voice-assist-mode">Bantuan naskah</label><select id="voice-assist-mode"><option value="tidy">Rapikan naskah</option><option value="generate">Buat naskah dari ide</option></select>
