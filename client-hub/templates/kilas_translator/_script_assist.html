<details class="voice-script-assist" id="voice-script-assist">

<details class="voice-dictation-info"><summary>{{ ui_t("Privasi dikte") }}</summary><p id="voice-assist-mic-note">{{ ui_t("Dikte memakai pengenalan suara browser, yang dapat mengirim suara ke layanan browser. Tekan mic untuk mulai; teks tidak dikirim ke AI otomatis.") }}</p></details>
<div class="voice-assist-actions"><button type="button" class="btn secondary" id="voice-assist-undo" hidden>{{ ui_t("Undo bantuan AI") }}</button><a id="voice-assist-history" href="#" hidden>{{ ui_t("Lihat percakapan") }}</a></div>
