<style>
.wrap{max-width:1280px}
.kw-inbox-shell{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:14px;height:calc(100vh - 190px);height:calc(100dvh - 190px);min-height:440px;max-height:900px}
.kw-inbox-sidebar,.kw-chat{min-width:0;min-height:0;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.kw-inbox-toolbar{padding:14px;border-bottom:1px solid var(--border);flex-shrink:0}.kw-conversations{overflow:auto;min-height:0;flex:1}
.kw-conversation{display:block;padding:12px 14px;color:inherit;border-bottom:1px solid var(--border);text-decoration:none}.kw-conversation:hover{background:rgba(255,255,255,.025);text-decoration:none}.kw-conversation.active{background:rgba(255,122,26,.08)}
.kw-row{display:flex;justify-content:space-between;gap:10px;align-items:center}.kw-row strong{min-width:0;overflow-wrap:anywhere}.kw-preview{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}
.kw-chat-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;flex-shrink:0;max-height:35%;overflow:auto;overflow-wrap:anywhere}
.kw-thread{flex:1;min-height:0;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:9px}.kw-bubble{flex-shrink:0;max-width:85%;min-width:0;border:1px solid var(--border);border-radius:14px;padding:9px 11px;overflow-wrap:anywhere}.kw-bubble.customer{align-self:flex-start;background:rgba(148,163,184,.11)}.kw-bubble.business{align-self:flex-end;background:rgba(255,122,26,.09)}
.kw-compose{border-top:1px solid var(--border);padding:14px 16px;max-height:50%;overflow:auto;flex-shrink:0}.kw-filters{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:8px}
.kw-inbox-shell input,.kw-inbox-shell select,.kw-inbox-shell textarea{min-width:0;max-width:100%;box-sizing:border-box}.kw-inbox-shell .btn,.kw-inbox-shell .pill{max-width:100%;white-space:normal;overflow-wrap:anywhere}.kw-back{display:none}.kw-inbox-shell button:disabled{opacity:.55;cursor:not-allowed}
@media(max-width:900px){
.kw-inbox-shell{grid-template-columns:minmax(0,1fr);height:calc(100vh - 170px);height:calc(100dvh - 170px);min-height:380px}
.kw-inbox-shell.no-selection .kw-chat{display:none}.kw-inbox-shell.has-selection .kw-inbox-sidebar{display:none}
.kw-back{display:inline-flex}.kw-thread{padding:12px}.kw-chat-head,.kw-compose{padding:12px}
}
</style>
<script>
(function(){
  function latest(){const thread=document.getElementById('kw-thread');if(thread)thread.scrollTop=thread.scrollHeight;}
  document.addEventListener('DOMContentLoaded',latest,{once:true});
  window.addEventListener('load',latest,{once:true});
})();
</script>
