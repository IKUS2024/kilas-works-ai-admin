<style>
.client-page{max-width:920px;margin:0 auto}
.client-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}.client-head h1{font-size:24px;margin:0 0 4px}.client-head p{margin:0;color:var(--text-dim);font-size:12px}.client-count{font-size:11px;color:var(--text-dim)}
.client-toolbar{display:flex;gap:6px;overflow-x:auto;padding:1px 0 8px;scrollbar-width:none}.client-toolbar::-webkit-scrollbar{display:none}.client-toolbar .btn{flex:0 0 auto;border-radius:999px;margin:0}
.client-list{display:grid;gap:7px}.client-item{border:1px solid var(--border);border-radius:14px;padding:10px;background:rgba(255,255,255,.01);min-width:0}.client-item-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.client-item-main{min-width:0}.client-item-title{font-weight:800;overflow-wrap:anywhere}.client-item-meta{font-size:12px;color:var(--text-dim);line-height:1.4;margin-top:3px}.client-item-side{flex:0 0 auto;text-align:right}
.client-status{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;background:#33363c;color:#d5d7db;font-size:10px;font-weight:750;line-height:1.15}.client-status.ok{background:rgba(62,207,142,.12);color:var(--green)}.client-status.warn{background:rgba(224,185,59,.12);color:var(--yellow)}.client-status.info{background:rgba(127,211,240,.12);color:#7fd3f0}.client-status.danger{background:rgba(241,101,101,.12);color:var(--red)}
.client-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.client-actions form{margin:0}.client-actions .btn{margin:0}
.client-collapsible{padding:0;overflow:hidden}.client-collapsible>summary{list-style:none;cursor:pointer;padding:12px 13px;font-weight:800}.client-collapsible>summary::-webkit-details-marker{display:none}.client-collapsible>summary::after{content:"⌄";float:right;color:var(--text-dim)}.client-collapsible[open]>summary{border-bottom:1px solid var(--border)}.client-collapsible[open]>summary::after{content:"⌃"}.client-collapsible-body{padding:11px 13px}
.client-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.client-stat{border:1px solid var(--border);border-radius:13px;padding:10px;text-align:center;min-width:0}.client-stat strong{display:block;font-size:18px;overflow-wrap:anywhere}.client-stat span{display:block;color:var(--text-dim);font-size:10px;margin-top:3px}
.client-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.client-card{border:1px solid var(--border);border-radius:15px;padding:11px;min-width:0;background:rgba(255,255,255,.01)}
.client-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}.client-form-grid label{margin-top:0}.client-form-grid .full{grid-column:1/-1}
.client-note{font-size:12px;color:var(--text-dim);line-height:1.45}.client-empty{border:1px dashed var(--border);border-radius:13px;padding:16px;color:var(--text-dim);font-size:13px}
.client-primary{display:flex;gap:8px;flex-wrap:wrap}.client-primary .btn{margin:0}
@media(max-width:700px){.client-head{display:block;margin-bottom:10px}.client-head h1{font-size:21px}.client-head .btn{margin-top:8px}.client-grid{grid-template-columns:1fr}.client-form-grid{grid-template-columns:1fr;gap:8px}.client-item{padding:9px}.client-stats{grid-template-columns:repeat(3,minmax(0,1fr))}.client-collapsible>summary{padding:11px 12px}.client-collapsible-body{padding:10px 12px}.client-note{margin:7px 0}}
@media(max-width:430px){.client-stats{gap:6px}.client-stat{padding:8px 4px}.client-stat strong{font-size:15px}.client-stat span{font-size:9px}.client-item-side .btn{padding:7px 9px;font-size:11px}.client-card{padding:11px}}
</style>
