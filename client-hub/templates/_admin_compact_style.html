<style>
.admin-page{max-width:1080px;margin:0 auto}.admin-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:11px}.admin-head h1{font-size:23px;margin:0 0 4px}.admin-head p{margin:0;color:var(--text-dim);font-size:12px}.admin-count{font-size:11px;color:var(--text-dim)}
.admin-toolbar{display:flex;gap:6px;overflow-x:auto;padding:1px 0 7px;scrollbar-width:none}.admin-toolbar::-webkit-scrollbar{display:none}.admin-toolbar .btn{flex:0 0 auto;border-radius:999px;margin:0}
.admin-collapsible{padding:0;overflow:hidden}.admin-collapsible>summary{list-style:none;cursor:pointer;padding:11px 13px;font-weight:800;font-size:13px}.admin-collapsible>summary::-webkit-details-marker{display:none}.admin-collapsible>summary::after{content:"⌄";float:right;color:var(--text-dim)}.admin-collapsible[open]>summary{border-bottom:1px solid var(--border)}.admin-collapsible[open]>summary::after{content:"⌃"}.admin-collapsible-body{padding:10px 13px}
.admin-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px}.admin-form-grid label{margin-top:0}.admin-form-grid .full{grid-column:1/-1}
.admin-list{display:grid;gap:7px}.admin-item{border:1px solid var(--border);border-radius:13px;padding:9px 10px;min-width:0;background:rgba(255,255,255,.01)}.admin-item-head{display:flex;align-items:flex-start;justify-content:space-between;gap:9px}.admin-item-main{min-width:0}.admin-item-title{font-weight:800;overflow-wrap:anywhere;font-size:13px}.admin-item-meta{font-size:11px;color:var(--text-dim);margin-top:2px;line-height:1.35}.admin-item-side{flex:0 0 auto;text-align:right}.admin-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.admin-actions form{margin:0}.admin-actions .btn{margin:0}
.admin-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-bottom:9px}.admin-stat{border:1px solid var(--border);border-radius:12px;padding:8px 6px;text-align:center}.admin-stat strong{display:block;font-size:16px}.admin-stat span{display:block;color:var(--text-dim);font-size:9px;margin-top:2px}
.admin-status{display:inline-flex;align-items:center;padding:4px 7px;border-radius:999px;background:#33363c;color:#d5d7db;font-size:10px;font-weight:750;line-height:1.2}.admin-status.ok{background:rgba(62,207,142,.12);color:var(--green)}.admin-status.warn{background:rgba(224,185,59,.12);color:var(--yellow)}.admin-status.danger{background:rgba(241,101,101,.12);color:var(--red)}.admin-status.info{background:rgba(127,211,240,.12);color:#7fd3f0}
.admin-empty{border:1px dashed var(--border);border-radius:12px;padding:12px;color:var(--text-dim);font-size:12px}.admin-note{font-size:11px;color:var(--text-dim);line-height:1.4}
.admin-search-card{padding:10px 11px;margin-bottom:9px}.admin-search-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center}.admin-search-row input,.admin-search-row .btn{margin:0}
.admin-list-meta{text-align:center;color:var(--text-dim);font-size:10px;margin:-2px 0 7px}
.admin-pagination{display:flex;justify-content:center;gap:6px;overflow-x:auto;scrollbar-width:none;padding:3px 0 9px}.admin-pagination::-webkit-scrollbar{display:none}
.admin-page-btn{flex:0 0 auto;min-width:34px;height:34px;padding:0 9px;border:1px solid var(--border);border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:11px;font-weight:800;text-decoration:none;background:rgba(255,255,255,.01)}
.admin-page-btn:hover{border-color:#4a4e56;color:var(--text);text-decoration:none}.admin-page-btn.active{background:var(--orange);border-color:var(--orange);color:#171717}.admin-page-btn.disabled{opacity:.38;pointer-events:none}

</style>
