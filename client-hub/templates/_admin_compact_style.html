<style>
.admin-page{max-width:980px;margin:0 auto}.admin-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:16px}.admin-head h1{font-size:26px;margin:0 0 5px}.admin-head p{margin:0;color:var(--text-dim);font-size:13px}.admin-count{font-size:12px;color:var(--text-dim)}
.admin-toolbar{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.admin-toolbar::-webkit-scrollbar{display:none}.admin-toolbar .btn{flex:0 0 auto;border-radius:999px;margin:0}
.admin-collapsible{padding:0;overflow:hidden}.admin-collapsible>summary{list-style:none;cursor:pointer;padding:15px 16px;font-weight:800}.admin-collapsible>summary::-webkit-details-marker{display:none}.admin-collapsible>summary::after{content:"⌄";float:right;color:var(--text-dim)}.admin-collapsible[open]>summary{border-bottom:1px solid var(--border)}.admin-collapsible[open]>summary::after{content:"⌃"}.admin-collapsible-body{padding:14px 16px}
.admin-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}.admin-form-grid label{margin-top:0}.admin-form-grid .full{grid-column:1/-1}
.admin-list{display:grid;gap:9px}.admin-item{border:1px solid var(--border);border-radius:14px;padding:12px;min-width:0;background:rgba(255,255,255,.01)}.admin-item-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.admin-item-main{min-width:0}.admin-item-title{font-weight:800;overflow-wrap:anywhere}.admin-item-meta{font-size:12px;color:var(--text-dim);margin-top:3px;line-height:1.35}.admin-item-side{flex:0 0 auto;text-align:right}.admin-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.admin-actions form{margin:0}.admin-actions .btn{margin:0}
.admin-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}.admin-stat{border:1px solid var(--border);border-radius:13px;padding:10px;text-align:center}.admin-stat strong{display:block;font-size:18px}.admin-stat span{display:block;color:var(--text-dim);font-size:10px;margin-top:3px}
.admin-status{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;background:#33363c;color:#d5d7db;font-size:10px;font-weight:750;line-height:1.2}.admin-status.ok{background:rgba(62,207,142,.12);color:var(--green)}.admin-status.warn{background:rgba(224,185,59,.12);color:var(--yellow)}.admin-status.danger{background:rgba(241,101,101,.12);color:var(--red)}.admin-status.info{background:rgba(127,211,240,.12);color:#7fd3f0}
.admin-empty{border:1px dashed var(--border);border-radius:13px;padding:16px;color:var(--text-dim);font-size:13px}.admin-note{font-size:12px;color:var(--text-dim);line-height:1.45}
@media(max-width:700px){.admin-head{display:block}.admin-head h1{font-size:22px}.admin-head .btn{margin-top:10px}.admin-form-grid{grid-template-columns:1fr}.admin-stats{grid-template-columns:repeat(3,minmax(0,1fr))}.admin-item{padding:11px}.admin-item-head{gap:8px}}
@media(max-width:430px){.admin-stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.admin-stat{padding:8px 4px}.admin-stat strong{font-size:16px}.admin-stat span{font-size:9px}.admin-item-side .btn{padding:7px 9px;font-size:11px}}
</style>
