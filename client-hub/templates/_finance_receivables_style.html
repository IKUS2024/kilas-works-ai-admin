<style>
.fin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}.fin-grid>*{min-width:0}.fin-page{overflow-wrap:anywhere}.fin-page .btn{max-width:100%;white-space:normal;margin:10px 6px 0 0}.fin-page input,.fin-page select{min-width:0;max-width:100%}.fin-entry{padding:14px 0;border-top:1px solid var(--border)}.fin-entry p{margin:6px 0}.fin-total{font-size:24px;font-weight:bold}.fin-page summary{cursor:pointer}.fin-overdue{color:var(--yellow)}
@media print{.topbar,footer,.flash,.no-print{display:none!important}body{background:white;color:black}.card{background:white;border-color:#aaa}.muted{color:#444}.wrap{max-width:none;padding:0}.fin-entry{break-inside:avoid}.fin-page a{color:black}}
</style>

<style>
.fin-top-actions,.fin-toolbar,.fin-section-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.fin-section-head{justify-content:space-between}.fin-section-head h2{margin:0}
.fin-tool-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}.fin-tool-grid.compact{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.fin-tool{display:flex;min-height:105px;padding:14px;border:1px solid var(--border);border-radius:16px;text-decoration:none;color:inherit;flex-direction:column;justify-content:center;gap:5px;background:transparent}
.fin-tool:hover,.fin-tool:focus,.fin-tool.active{background:rgba(127,127,127,.08)}.fin-tool.active{outline:2px solid var(--orange,#ff7a1a);outline-offset:-2px}
.fin-icon{font-size:28px;line-height:1}.fin-label{font-weight:800}.fin-meta{font-size:12px;color:var(--muted)}
.fin-form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.fin-empty{border:1px dashed var(--border);border-radius:14px;padding:16px;color:var(--muted)}
@media(max-width:560px){.fin-tool-grid,.fin-tool-grid.compact{grid-template-columns:repeat(2,minmax(0,1fr))}.fin-tool{min-height:98px;padding:12px}.fin-section-head{align-items:flex-start}}

.fin-area-nav{margin:2px 0 18px}.fin-back-link{display:inline-flex;align-items:center;gap:6px;color:var(--orange,#ff7a1a);text-decoration:none;font-weight:700;font-size:14px;margin:0 0 10px}.fin-back-link:hover,.fin-back-link:focus{text-decoration:underline}
.fin-area-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:3px 0 7px;border-bottom:1px solid var(--border)}.fin-area-tabs::-webkit-scrollbar{display:none}
.fin-area-tab{flex:0 0 auto;white-space:nowrap;text-decoration:none;color:var(--muted);font-size:14px;font-weight:750;padding:10px 12px;border-radius:10px;transition:background .15s ease,color .15s ease}
.fin-area-tab:hover,.fin-area-tab:focus{color:inherit;background:rgba(127,127,127,.08)}.fin-area-tab.active{color:var(--orange,#ff7a1a);background:color-mix(in srgb,var(--orange,#ff7a1a) 10%,transparent);box-shadow:inset 0 -2px 0 var(--orange,#ff7a1a)}
.fin-page-title{margin:14px 0 4px}.fin-page-subtitle{margin:0 0 18px}
@media(max-width:560px){.fin-area-nav{margin-bottom:14px}.fin-back-link{font-size:13px;margin-bottom:8px}.fin-area-tabs{margin-right:-16px;padding-right:16px}.fin-area-tab{font-size:13px;padding:9px 10px}.fin-page-title{font-size:28px;line-height:1.15;margin-top:12px}}
</style>
