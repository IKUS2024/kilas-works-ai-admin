<style>
.fin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}.fin-grid>*{min-width:0}.fin-page{overflow-wrap:anywhere}.fin-page .btn{max-width:100%;white-space:normal;margin:10px 6px 0 0}.fin-page input,.fin-page select{min-width:0;max-width:100%}.fin-entry{padding:14px 0;border-top:1px solid var(--border)}.fin-entry p{margin:6px 0}.fin-total{font-size:24px;font-weight:bold}.fin-page summary{cursor:pointer}.fin-overdue{color:var(--yellow)}
@media print{.topbar,footer,.flash,.no-print{display:none!important}body{background:white;color:black}.card{background:white;border-color:#aaa}.muted{color:#444}.wrap{max-width:none;padding:0}.fin-entry{break-inside:avoid}.fin-page a{color:black}}
</style>

<style>
.fin-top-actions,.fin-toolbar,.fin-section-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.fin-section-head{justify-content:space-between}.fin-section-head h2{margin:0}
.fin-tool-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px}.fin-tool-grid.compact{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.fin-tool{display:flex;min-height:92px;padding:12px;border:1px solid var(--border);border-radius:16px;text-decoration:none;color:inherit;flex-direction:column;justify-content:center;gap:5px;background:transparent}
.fin-tool:hover,.fin-tool:focus,.fin-tool.active{background:rgba(127,127,127,.08)}.fin-tool.active{outline:2px solid var(--orange,#ff7a1a);outline-offset:-2px}
.fin-icon{font-size:24px;line-height:1}.fin-label{font-weight:800}.fin-meta{font-size:11px;color:var(--muted)}
.fin-form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.fin-empty{border:1px dashed var(--border);border-radius:14px;padding:16px;color:var(--muted)}
@media(max-width:560px){.fin-tool-grid,.fin-tool-grid.compact{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.fin-tool{min-height:76px;padding:10px}.fin-icon{font-size:21px}.fin-label{font-size:14px}.fin-section-head{align-items:flex-start}}

.fin-area-nav{margin:0 0 12px}.fin-back-link{display:inline-flex;align-items:center;gap:6px;color:var(--orange,#ff7a1a);text-decoration:none;font-weight:700;font-size:14px;margin:0 0 10px}.fin-back-link:hover,.fin-back-link:focus{text-decoration:underline}
.fin-area-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:3px 0 7px;border-bottom:1px solid var(--border)}.fin-area-tabs::-webkit-scrollbar{display:none}
.fin-area-tab{flex:0 0 auto;white-space:nowrap;text-decoration:none;color:var(--muted);font-size:13px;font-weight:750;padding:8px 10px;border-radius:10px;transition:background .15s ease,color .15s ease}
.fin-area-tab:hover,.fin-area-tab:focus{color:inherit;background:rgba(127,127,127,.08)}.fin-area-tab.active{color:var(--orange,#ff7a1a);background:color-mix(in srgb,var(--orange,#ff7a1a) 10%,transparent);box-shadow:inset 0 -2px 0 var(--orange,#ff7a1a)}
.fin-page-title{margin:10px 0 3px}.fin-page-subtitle{margin:0 0 12px}
@media(max-width:560px){.fin-area-nav{margin-bottom:10px}.fin-back-link{font-size:12px;margin-bottom:6px}.fin-area-tabs{margin-right:-10px;padding-right:10px}.fin-area-tab{font-size:12px;padding:7px 9px}.fin-page-title{font-size:23px;line-height:1.15;margin-top:8px}.fin-page-subtitle{font-size:12px;margin-bottom:10px}}
</style>

<style>
.fin-invoice-row{display:flex;flex-direction:column;gap:8px}
.fin-invoice-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.fin-invoice-number{font-weight:850;font-size:16px}
.fin-invoice-meta{display:flex;flex-wrap:wrap;gap:6px 10px;color:var(--muted);font-size:12px}
.fin-invoice-amounts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fin-invoice-amounts span{display:flex;flex-direction:column;gap:2px;padding:9px 10px;border:1px solid var(--border);border-radius:12px}
.fin-invoice-amounts small{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.04em}
.fin-status{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:850;border:1px solid var(--border)}
.fin-status-draft{background:rgba(127,127,127,.08)}
.fin-status-issued{background:rgba(255,122,26,.10);color:#ffb37a;border-color:rgba(255,122,26,.35)}
.fin-status-partial{background:rgba(255,193,7,.10);color:#f7cc5e;border-color:rgba(255,193,7,.30)}
.fin-status-paid{background:rgba(51,186,113,.12);color:#78dca5;border-color:rgba(51,186,113,.32)}
.fin-invoice-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fin-invoice-actions form{margin:0}
.finance-danger{border-color:rgba(235,87,87,.45)!important;color:#ff8f8f!important}
@media(max-width:560px){.fin-invoice-amounts{grid-template-columns:1fr 1fr}.fin-invoice-amounts span:last-child{grid-column:1/-1}}
</style>


<style>
.fin-menu-card{padding-bottom:14px}
.fin-receivable-explainer{padding:14px 16px;margin-bottom:14px}
.fin-receivable-explainer strong{display:block;margin-bottom:5px}.fin-receivable-explainer p{margin:0;color:var(--muted);line-height:1.5;font-size:13px}
.fin-summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.fin-summary-card{min-height:116px;padding:15px;display:flex;flex-direction:column;justify-content:center;gap:5px}
.fin-summary-card strong{font-size:25px;line-height:1.1}.fin-summary-card small{color:var(--muted);font-size:11px;line-height:1.35}
.fin-summary-label{font-weight:800;font-size:13px}.fin-summary-money{grid-column:span 2}
.fin-compact-money{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.fin-compact-money b{color:inherit;margin-left:3px}.fin-accounting-note{margin:0!important;font-size:11px;color:var(--muted)}
.fin-invoice-compact{gap:6px;padding:12px 0}.fin-invoice-compact .fin-invoice-actions .btn{margin-top:2px}
.fin-search-row,.fin-filter-bar{display:flex;flex-wrap:wrap;align-items:end;gap:9px;padding:12px 0 4px}
.fin-search-row label,.fin-filter-bar label{margin:0;min-width:150px}.fin-grow{flex:1 1 220px}
.fin-inline-edit{margin-top:8px;padding:12px;border:1px solid var(--border);border-radius:12px;background:rgba(127,127,127,.04);min-width:min(480px,82vw)}
.fin-inline-edit textarea{min-height:76px}
.fin-pagination{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.fin-pagination .btn{margin:0}
@media(max-width:560px){
  .fin-summary-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .fin-summary-card{min-height:96px;padding:12px}.fin-summary-card strong{font-size:21px}.fin-summary-money{grid-column:1/-1}
  .fin-invoice-compact .fin-invoice-head{align-items:flex-start}.fin-invoice-compact .fin-invoice-number{font-size:14px}
  .fin-invoice-compact .fin-invoice-meta{font-size:10px}.fin-compact-money{font-size:11px;gap:4px 9px}
  .fin-filter-bar{display:grid;grid-template-columns:1fr 1fr}.fin-filter-bar .fin-grow{grid-column:1/-1}.fin-filter-bar button{grid-column:1/-1}
  .fin-search-row{display:grid;grid-template-columns:1fr auto}.fin-search-row .fin-grow{min-width:0}
  .fin-inline-edit{min-width:0;width:min(78vw,430px)}
}
</style>


<style>
.fin-aging-card{padding:0;overflow:hidden}.fin-aging-card>summary{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;list-style:none}.fin-aging-card>summary::-webkit-details-marker{display:none}
.fin-aging-list{border-top:1px solid var(--border)}.fin-aging-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid color-mix(in srgb,var(--border) 65%,transparent)}.fin-aging-row:first-child{border-top:0}.fin-aging-row span{font-size:12px}.fin-aging-row strong{font-size:12px;font-variant-numeric:tabular-nums}.fin-aging-row small{font-size:10px;color:var(--muted)}
.fin-collection-filter{padding-bottom:14px}.fin-collection-filter .btn{margin-top:8px}.fin-collection-row{display:flex;flex-direction:column;gap:7px}
@media(max-width:560px){.fin-aging-row{grid-template-columns:minmax(0,1fr) auto}.fin-aging-row small{grid-column:1/-1}.fin-collection-row .fin-toolbar .btn{padding:7px 9px;font-size:11px}}
</style>
