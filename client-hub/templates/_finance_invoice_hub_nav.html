{% set invoice_tab = invoice_tab or 'summary' %}
<nav class="invoice-hub-nav" aria-label="{{ ui_t('Menu Invoice') }}">
  <a class="{{ 'active' if invoice_tab=='summary' else '' }}" href="{{ url_for('finance.receivables',business_id=business.id,branch_id=g.finance_branch_id,section='summary') }}">{{ ui_t('Ringkasan') }}</a>
  <a class="{{ 'active' if invoice_tab=='customers' else '' }}" href="{{ url_for('finance.receivables',business_id=business.id,branch_id=g.finance_branch_id,section='customers') }}">{{ ui_t('Pelanggan') }}</a>

  <a class="{{ 'active' if invoice_tab=='collections' else '' }}" href="{{ url_for('finance.collections',business_id=business.id,branch_id=g.finance_branch_id,section='queue') }}">{{ ui_t('Penagihan') }}</a>
