{% if linked_jobs %}
<style>
[data-linked-jobs] .client-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
[data-linked-jobs] .client-item{display:block;overflow-wrap:anywhere;padding:10px;border:1px solid var(--border);border-radius:10px}
[data-linked-jobs] .job-next-action{font-size:14px;line-height:1.45;margin-top:5px}
</style>
<div class="card" data-linked-jobs>
  <h2>Tindakan</h2>
  <div class="client-actions">
    {% if not linked_jobs.rows %}
    <a class="btn secondary" data-create-job href="{{ url_for('core_jobs.new_page',bid=business.id,customer_id=linked_jobs.customer_id) }}">Tambah tindakan</a>
    {% endif %}
    <a class="btn secondary" href="{{ url_for('core_jobs.list_page',bid=business.id,customer_id=linked_jobs.customer_id) }}">Buka Jobs</a>
  </div>
  {% for row in linked_jobs.rows %}
  <a class="client-item" href="{{ url_for('core_jobs.detail_page',bid=business.id,job_id=row.id) }}">
    <strong>{{ row.fields.action or row.title }}</strong>
    <div class="client-item-meta">{{ row.status_label }}</div>
  </a>
  {% else %}
  <p class="client-note">Belum ada tindakan untuk customer ini.</p>
  {% endfor %}
</div>
{% endif %}
