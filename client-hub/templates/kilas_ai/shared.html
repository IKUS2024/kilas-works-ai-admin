<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ view.title }} · Kilas AI</title><link rel="stylesheet" href="{{ url_for('static',filename='kilas_ai.css',v='1') }}">{% include '_premium_styles.html' %}</head><body class="kilas-light "><main class="ai-share-page"><h1>{{ view.title }}</h1><p>Chat Kilas AI yang dibagikan untuk dibaca.</p>{% for message in view.messages %}<article class="ai-message"><div class="ai-message-name">{{ 'Pengguna' if message.role == 'user' else 'Kilas AI' }}</div><div class="ai-message-text">{{ message.content }}</div></article>{% endfor %}</main></body></html>
