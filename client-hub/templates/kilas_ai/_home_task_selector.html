    <div class="home-tool-selector"><div class="home-task-choices" role="group" aria-label="{{ ui_t('Pilihan tugas Kilas AI') }}">

      <button type="button" data-home-task="{{ value }}" aria-pressed="{{ 'true' if value=='chat' else 'false' }}" aria-controls="home-task-context">{% include 'kilas_ai/_home_task_icon.html' %}<span>{{ ui_t(label) }}</span></button>
