<section class="video-scene-prompts video-prompt" aria-label="Clip {{ loop.index }} prompts">
<section class="video-clip-step"><h5>{{ ui_t('1. Buat gambar referensi') }}</h5><pre data-video-prompt="image_{{ loop.index }}">{{ scene.image_prompt }}</pre><button type="button" class="btn secondary" data-video-copy="image_{{ loop.index }}">{{ ui_t('Salin Prompt Gambar') }}</button></section>
<section class="video-clip-step"><h5>{{ ui_t('2. Buat video') }}</h5><pre data-video-prompt="video_{{ loop.index }}">{{ package['video_'~loop.index] }}</pre><button type="button" class="btn secondary" data-video-copy="video_{{ loop.index }}">{{ ui_t('Salin Prompt Video') }}</button></section>
</section>
