{% if project %}<details class="video-manage"><summary>Kelola rencana</summary><form method="post" action="{{ url_for('kilas_ai.video_action',project=project.id,action='rename') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="video-title">Nama rencana</label><input id="video-title" name="title" value="{{ project.title }}" required maxlength="60"><button class="btn secondary">Simpan nama</button></form><form method="post" action="{{ url_for('kilas_ai.video_action',project=project.id,action='duplicate') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn secondary">Duplikat rencana</button></form><button type="button" class="video-delete" data-video-delete>Hapus rencana</button></details><dialog id="video-delete-dialog"><h2>Hapus rencana ini?</h2><p>Rencana ini akan disembunyikan dari riwayat kamu.</p><form method="post" action="{{ url_for('kilas_ai.video_action',project=project.id,action='delete') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="confirm" value="delete"><button type="button" class="btn secondary" data-video-cancel>Batal</button><button class="btn">Hapus rencana</button></form></dialog>{% endif %}
