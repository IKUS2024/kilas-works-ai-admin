{% extends "base.html" %}
{% block title %}Lupa Password — Kilas Works Business Hub{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:40px auto;">
  <h1>Lupa Password</h1>
  <p class="muted">Masukkan email akunmu. Kalau terdaftar, kami kirim link reset password.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Email</label>
    <input type="email" name="email" value="{{ email or '' }}" required>
    <div style="margin-top:18px;"><button class="btn" type="submit">Kirim Link Reset</button></div>
  </form>
  <p class="muted" style="margin-top:14px;"><a href="{{ url_for('auth.login_page') }}">Kembali ke Login</a></p>
</div>
{% endblock %}
