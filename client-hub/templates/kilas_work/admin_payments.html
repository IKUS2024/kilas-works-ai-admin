<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verifikasi Work · Kilas</title><link rel="stylesheet" href="{{ url_for('static',filename='kilas_work.css',v='1') }}"></head><body><main class="work-page"><h1>Verifikasi pembayaran Kilas Work</h1>{% for item in orders %}<section class="work-plan"><h2>{{ item.invoice_number }}</h2><p>{{ item.email }} · {{ item.kind }} {{ item.sku }} · Rp{{ '{:,.0f}'.format(item.amount_idr).replace(',', '.') }}</p><p><a href="{{ url_for('kilas_work_admin.admin_proof',order_id=item.id) }}" target="_blank" rel="noopener">Lihat bukti</a></p><form method="post" action="{{ url_for('kilas_work_admin.admin_review',order_id=item.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Catatan admin<input name="note" maxlength="1000"></label><button name="decision" value="VERIFIED">Verifikasi</button><button name="decision" value="REJECTED" class="work-reject">Tolak</button></form></section>{% else %}<p>Tidak ada pembayaran Work menunggu review.</p>{% endfor %}</main></body></html>
