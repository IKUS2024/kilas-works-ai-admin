<div><label for="period-month">Bulan</label><select id="period-month" name="period_month" required data-current-year="{{ current_year }}" data-current-month="{{ current_month }}">{% for label in ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'] %}<option value="{{ '%02d'|format(loop.index) }}" {% if loop.index == month[5:]|int %}selected{% endif %} {% if selected_year == current_year and loop.index > current_month %}disabled{% endif %}>{{ label }}</option>{% endfor %}</select></div>
<div><label for="period-year">Tahun</label><select id="period-year" name="period_year" required>{% for year in period_years %}<option value="{{ '%04d'|format(year) }}" {% if year == selected_year %}selected{% endif %}>{{ year }}</option>{% endfor %}</select></div>
<script>
(() => {
  const monthSelect = document.getElementById('period-month');
  const yearSelect = document.getElementById('period-year');
  if (!monthSelect || !yearSelect || monthSelect.dataset.periodYearSync === '1') return;
  monthSelect.dataset.periodYearSync = '1';
  const currentYear = Number(monthSelect.dataset.currentYear);
  const currentMonth = Number(monthSelect.dataset.currentMonth);
  const syncMonths = () => {
    const selectedYear = Number(yearSelect.value);
    for (const option of monthSelect.options) {
      const optionMonth = Number(option.value);
      option.disabled = selectedYear > currentYear || (selectedYear === currentYear && optionMonth > currentMonth);
    }
    if (monthSelect.selectedOptions[0]?.disabled) {
      monthSelect.value = String(currentMonth).padStart(2, '0');
    }
  };
  yearSelect.addEventListener('change', syncMonths);
  syncMonths();
})();
</script>
