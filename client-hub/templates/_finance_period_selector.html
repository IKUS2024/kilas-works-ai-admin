<div><label for="period-month">Bulan</label><select id="period-month" name="period_month" required>{% for label in ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'] %}<option value="{{ '%02d'|format(loop.index) }}" {% if loop.index == month[5:]|int %}selected{% endif %} {% if selected_year == current_year and loop.index > current_month %}disabled{% endif %}>{{ label }}</option>{% endfor %}</select></div>
<div><label for="period-year">Tahun</label><select id="period-year" name="period_year" required>{% for year in period_years %}<option value="{{ '%04d'|format(year) }}" {% if year == selected_year %}selected{% endif %}>{{ year }}</option>{% endfor %}</select></div>
