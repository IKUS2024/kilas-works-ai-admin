<div class="fin-grid"><div><label>Tanggal<input type="date" name="transaction_date" value="{{ r.occurred_on if r else '' }}" max="{{ today }}" required></label></div><div><label>Arah<select name="direction" required><option value="">Pilih arah</option>{% for direction in ['INCOME','EXPENSE'] %}<option value="{{ direction }}" {{ 'selected' if r and r.direction==direction }}>{{ direction }}</option>{% endfor %}</select></label></div><div><label>Nominal rupiah bulat<input name="amount" inputmode="numeric" pattern="[0-9]+" maxlength="19" value="{{ r.amount_minor if r else '' }}" required></label></div></div>
<label>Deskripsi<input name="description" maxlength="500" value="{{ r.description if r else '' }}"></label><label>Referensi<input name="reference" maxlength="160" value="{{ r.reference or '' if r else '' }}"></label>
