<div class="fin-grid"><div><label>{{ ui_t('Tanggal') }}<input type="date" name="transaction_date" value="{{ r.occurred_on if r else '' }}" max="{{ today }}" required></label></div><div><label>{{ ui_t('Arah') }}<select name="direction" required><option value="">{{ ui_t('Pilih arah') }}</option>{% for direction in ['INCOME','EXPENSE'] %}<option value="{{ direction }}" {{ 'selected' if r and r.direction==direction }}>{{ direction }}</option>{% endfor %}</select></label></div><div><label>{{ ui_t('Nominal') }} {{ account.currency if account else '' }}<input name="amount" inputmode="decimal" maxlength="25" value="{{ r.amount_minor|finance_input_money(account.currency) if r and account else '' }}" required></label></div></div>
<label>{{ ui_t('Deskripsi') }}<input name="description" maxlength="500" value="{{ r.description if r else '' }}"></label><label>{{ ui_t('Referensi') }}<input name="reference" maxlength="160" value="{{ r.reference or '' if r else '' }}"></label>
