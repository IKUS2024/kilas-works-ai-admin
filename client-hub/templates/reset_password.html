{% extends "base.html" %}
{% block title %}Reset Password — Kilas Works Business Hub{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:40px auto;">
  <h1>Buat Password Baru</h1>
  <p class="muted">Link ini hanya berlaku sekali dan akan kedaluwarsa dalam 30 menit.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Password Baru</label>
    <input type="password" name="password" required minlength="8">
    <label>Konfirmasi Password Baru</label>
    <input type="password" name="confirm_password" required minlength="8">
    <div style="margin-top:18px;"><button class="btn" type="submit">Simpan Password Baru</button></div>
  </form>
</div>
{% endblock %}
