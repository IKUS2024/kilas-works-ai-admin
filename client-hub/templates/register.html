{% extends "base.html" %}
{% block title %}Daftar — Kilas Works Client Hub{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:40px auto;">
  <h1>Buat akun</h1>
  <p class="muted">Mulai onboarding AI Admin untuk bisnismu.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Nama lengkap</label>
    <input type="text" name="full_name" value="{{ full_name or '' }}">
    <label>Email</label>
    <input type="email" name="email" value="{{ email or '' }}" required>
    <label>Password (min 8 karakter)</label>
    <input type="password" name="password" minlength="8" required>
    <div style="margin-top:18px;"><button class="btn" type="submit">Daftar</button></div>
  </form>
  <p class="muted" style="margin-top:14px;">Sudah punya akun? <a href="{{ url_for('auth.login_page') }}">Login</a></p>
</div>
{% endblock %}
