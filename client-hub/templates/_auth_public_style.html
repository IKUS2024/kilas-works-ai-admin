<style>
body.public-ui{background:#0b0d10;color:#f5f6f8}
body.public-ui>.topbar{display:none}
body.public-ui>footer{display:none}
.wrap{max-width:none!important;margin:0!important;padding:0!important}
.auth-shell{
  --auth-bg:#0b0d10;--auth-panel:#15191f;--auth-border:#30363f;--auth-muted:#9da4ae;--auth-orange:#ff7a1a;
  min-height:100svh;box-sizing:border-box;background:
    radial-gradient(480px 330px at 82% 8%,rgba(255,122,26,.10),transparent 66%),
    radial-gradient(380px 280px at 3% 96%,rgba(255,122,26,.055),transparent 72%),
    var(--auth-bg);padding:26px 16px 22px;color:#f5f6f8
}
.auth-inner{width:min(100%,500px);margin:0 auto}
.auth-brand{display:flex;align-items:center;gap:13px;margin:2px 4px 12px}
.auth-logo-link{display:block;flex:0 0 auto;border-radius:17px;outline-offset:4px}
.auth-logo{width:58px;height:58px;display:block;border-radius:17px;box-shadow:0 10px 30px rgba(255,122,26,.11)}
.auth-wordmark strong{display:block;font-size:28px;line-height:1;letter-spacing:-.04em}
.auth-wordmark strong span{color:var(--auth-orange)}
.auth-wordmark small{display:block;margin-top:4px;color:#aeb4bd;font-size:14px}
.auth-tagline{margin:0 4px 18px;color:#aeb4bd;font-size:15px;line-height:1.45;max-width:330px}
.auth-tabs{width:min(100%,390px);display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:3px;border:1px solid #383e47;border-radius:999px;margin:0 auto 20px;background:#101318}
.auth-tab{min-height:42px;display:flex;align-items:center;justify-content:center;border-radius:999px;color:#b6bbc3;font-size:14px;font-weight:850;text-decoration:none}
.auth-tab:hover{text-decoration:none;color:#f5f6f8}
.auth-tab.active{color:#fff;background:linear-gradient(135deg,#ff8128,#9e3e0c);box-shadow:0 0 0 1px rgba(255,137,55,.72),0 7px 20px rgba(255,122,26,.18)}
.auth-card{border:1px solid var(--auth-border)!important;border-radius:24px!important;padding:25px!important;margin:0!important;background:linear-gradient(155deg,#181d24,#11151a)!important;box-shadow:0 24px 70px rgba(0,0,0,.28)}
.auth-card h1{font-size:40px;line-height:1;margin:0 0 12px;letter-spacing:-.045em}
.auth-card-lead{margin:0 0 22px;color:#aeb4bd;font-size:16px;line-height:1.5}
.auth-step{display:flex;align-items:center;gap:12px;margin:0 0 22px;padding:13px 14px;border:1px solid #30363f;border-radius:16px;background:rgba(255,255,255,.012)}
.auth-step-icon{width:40px;height:40px;flex:0 0 40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,122,26,.12);color:var(--auth-orange);font-size:20px;font-weight:900}
.auth-step strong{display:block;color:#f2f3f5;font-size:14px;line-height:1.2}
.auth-step span{display:block;color:#9da4ae;font-size:12.5px;line-height:1.35;margin-top:3px}
.auth-form label{margin:0 0 8px;color:#f0f2f5;font-weight:800;font-size:14px}
.auth-field{position:relative;margin-bottom:16px}
.auth-field input{min-height:56px;padding:0 48px;border-radius:15px!important;background:#0e1217!important;border:1px solid #3a414b!important;color:#fff!important;font-size:15px}
.auth-field input::placeholder{color:#747c87;opacity:1}
.auth-field input:focus{border-color:rgba(255,122,26,.78)!important;box-shadow:0 0 0 3px rgba(255,122,26,.09);outline:none}
.auth-field-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:21px;height:21px;color:#8f97a3;pointer-events:none}
.auth-field-icon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8}
.password-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:36px;height:36px!important;min-height:36px!important;padding:0!important;border:0!important;background:transparent!important;color:#aeb4bd!important;display:grid;place-items:center}
.password-toggle svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8}
.auth-submit{width:100%;min-height:56px!important;border-radius:14px!important;font-size:16px!important;font-weight:900!important;display:flex!important;align-items:center;justify-content:center;gap:10px;background:linear-gradient(180deg,#ff8229,#ff7415)!important;color:#16110d!important;box-shadow:0 12px 28px rgba(255,122,26,.20)}
.auth-forgot{display:inline-flex;margin:14px 0 0;color:var(--auth-orange);font-size:14px;font-weight:750}
.auth-divider{display:flex;align-items:center;gap:14px;margin:24px 0 18px;color:#838b96;font-size:12px}
.auth-divider::before,.auth-divider::after{content:"";height:1px;background:#3b4149;flex:1}
.oauth-list{display:grid;gap:10px}
.oauth-btn{min-height:54px;border:1px solid #404751;border-radius:14px;display:grid;grid-template-columns:34px 1fr 22px;align-items:center;gap:9px;padding:0 15px;color:#f3f4f6;background:rgba(255,255,255,.012);font-weight:850;text-decoration:none}
.oauth-btn:hover{border-color:#59616c;background:rgba(255,255,255,.03);text-decoration:none;color:#fff}
.oauth-icon{width:28px;height:28px;display:grid;place-items:center;font-weight:950;font-size:22px}
.oauth-icon.google svg{width:27px;height:27px;display:block}
.oauth-arrow{font-size:25px;color:#d5d8dd;line-height:1}
.auth-register{text-align:center;margin:22px 0 0!important;color:#aeb4bd!important;font-size:14px!important}
.auth-register a{font-weight:850;color:var(--auth-orange)}
.auth-register-note{margin-top:18px;padding-top:16px;border-top:1px solid #30363f;color:#8f97a3;font-size:12px;line-height:1.55}
.auth-footer{text-align:center;margin:70px 0 0;color:#747c87;font-size:11px;line-height:1.6}
@media(max-width:520px){
  .auth-shell{padding:18px 14px 18px}
  .auth-brand{gap:11px;margin-bottom:10px}
  .auth-logo{width:50px;height:50px;border-radius:15px}
  .auth-wordmark strong{font-size:25px}
  .auth-wordmark small{font-size:13px}
  .auth-tagline{font-size:14px;margin-bottom:15px}
  .auth-tabs{width:min(100%,340px);margin-bottom:18px}
  .auth-tab{min-height:40px;font-size:13.5px}
  .auth-card{padding:21px 17px!important;border-radius:21px!important}
  .auth-card h1{font-size:36px}
  .auth-card-lead{font-size:15px;margin-bottom:20px}
  .auth-step{padding:12px;margin-bottom:19px}
  .auth-step-icon{width:36px;height:36px;flex-basis:36px;font-size:18px}
  .auth-step strong{font-size:13.5px}
  .auth-step span{font-size:12px}
  .auth-field input{min-height:54px}
  .auth-submit{min-height:54px!important}
  .auth-footer{margin-top:58px}
}
</style>
